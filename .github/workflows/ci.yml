# AEP CI — runs ci.sh (schema/codegen diff gate, the spec-derived conformance
# runner, strict typecheck of the generated TypeScript). A separate `docs` job
# runs the zero-dep docs QA gate (docs/check-docs.sh) so public docs can't drift.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # Toolchain: Node 22, TypeScript 6.0.3, uv 0.11.x

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.x

      - name: ci.sh (jsonschema env via uv; Node already on PATH)
        run: uv run --no-project --with jsonschema bash ci.sh

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: docs/check-docs.sh (mermaid + links/anchors + banned-synonym + running-count + generated-page parity)
        run: bash docs/check-docs.sh

      # Site link gate for the Mintlify docs site rooted at docs/. Needs the
      # network (npx fetch), so it runs AFTER the offline gate above — the
      # offline checks stay the floor this job can never sink below.
      # mint is PINNED, not @latest: an unpinned `npx mint` tracks Mintlify's
      # newest release, so a broken publish upstream (e.g. a transitively
      # 404-ing dependency) fails this job on content that is actually fine.
      # The offline gate (docs/check-docs.sh, run above) remains authoritative
      # for link/anchor correctness; this pinned network pass is the extra
      # site-level check. Bump the pin deliberately after verifying the new
      # version installs and runs broken-links cleanly.
      - name: mint broken-links (site link gate)
        working-directory: docs
        run: npx --yes mint@4.2.733 broken-links
